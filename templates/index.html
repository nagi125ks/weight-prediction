<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Predictor AI</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.78);
            --border-color: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #f87171;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                /* Dark tint + subtle barbell knurling texture */
                linear-gradient(rgba(9, 13, 22, 0.78), rgba(9, 13, 22, 0.88)),
                repeating-linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 2px,
                    transparent 2px,
                    transparent 10px
                ),
                repeating-linear-gradient(
                    -45deg,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 2px,
                    transparent 2px,
                    transparent 10px
                ),
                /* Gym background photo */
                url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80');
            background-size: auto, auto, auto, cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        /* 1. Animated Gradient Shimmer Title */
        .title-gradient {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 5s ease infinite;
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. Typewriter Subtitle */
        .typewriter-box {
            display: inline-block;
            margin-bottom: 1.8rem;
            max-width: 100%;
        }

        .typewriter-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--primary);
            width: 0;
            animation: typing 2s steps(42, end) forwards, blinkCursor 0.8s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blinkCursor {
            50% { border-color: transparent; }
        }

        /* 3. Staggered Slide-Up Entrance */
        .reveal {
            opacity: 0;
            transform: translateY(18px);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.5s; }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        label span {
            color: var(--primary);
            font-weight: 500;
            font-size: 0.82rem;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.95rem 1.1rem;
            border-radius: 12px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-predict {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #090d16;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 25px -5px rgba(56, 189, 248, 0.55);
        }

        .btn-predict:active {
            transform: translateY(0);
        }

        .btn-predict:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Error Banner */
        .error-msg {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: var(--error);
            font-size: 0.88rem;
            animation: slideUp 0.3s ease forwards;
        }

        /* Result Card */
        .result-card {
            display: none;
            margin-top: 1.8rem;
            padding: 1.4rem;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(52, 211, 153, 0.3);
            text-align: center;
            animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .result-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .result-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--success);
            line-height: 1.2;
        }

        .result-unit {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 4px;
        }

        @media (max-width: 460px) {
            .typewriter-text {
                white-space: normal;
                border-right: none;
                width: 100%;
                animation: slideUp 0.8s ease forwards;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1 class="title-gradient">Weight Predictor</h1>
    <div class="typewriter-box">
        <p class="typewriter-text">Linear Regression Model • Instant Inference</p>
    </div>

    <form id="predictionForm" class="reveal delay-1" novalidate>
        <div class="form-group">
            <label for="heightInput">
                Enter Height / Input Feature
                <span>Numeric Value</span>
            </label>
            <div class="input-wrapper">
                <input
                    type="number"
                    id="heightInput"
                    step="any"
                    placeholder="e.g., 170"
                    autocomplete="off"
                    required
                >
            </div>
        </div>

        <button type="submit" class="btn-predict" id="predictBtn">
            Predict Weight
        </button>

        <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="result-card" id="resultCard">
        <div class="result-tag">Estimated Weight</div>
        <div>
            <span class="result-number" id="predictedValue">0.00</span>
            <span class="result-unit">kg</span>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('predictionForm');
    const heightInput = document.getElementById('heightInput');
    const predictBtn = document.getElementById('predictBtn');
    const resultCard = document.getElementById('resultCard');
    const predictedValueEl = document.getElementById('predictedValue');
    const errorMsgEl = document.getElementById('errorMsg');

    const MODEL_COEF = 62.66565656565657;
    const MODEL_INTERCEPT = -38.80808080808081;

    function showError(message) {
        errorMsgEl.textContent = message;
        errorMsgEl.style.display = 'block';
        resultCard.style.display = 'none';
    }

    function hideError() {
        errorMsgEl.style.display = 'none';
    }

    function animateCounter(element, start, target, duration = 750) {
        let startTime = null;

        function update(currentTime) {
            if (!startTime) startTime = currentTime;
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const ease = 1 - Math.pow(1 - progress, 3);
            const currentVal = start + (target - start) * ease;

            element.textContent = currentVal.toFixed(2);

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                element.textContent = Number(target).toFixed(2);
            }
        }

        requestAnimationFrame(update);
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideError();

        const rawValue = heightInput.value.trim();

        if (rawValue === '' || isNaN(Number(rawValue))) {
            showError('Please enter a valid numeric value.');
            heightInput.focus();
            return;
        }

        const numericInput = parseFloat(rawValue);

        if (!isFinite(numericInput)) {
            showError('Input value is out of valid range.');
            return;
        }

        predictBtn.disabled = true;
        predictBtn.textContent = 'Analyzing Model...';

        let finalPrediction = null;

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ feature: numericInput })
            });

            if (!response.ok) {
                throw new Error('Backend returned status ' + response.status);
            }

            const data = await response.json();

            if (data && data.success && typeof data.prediction === 'number') {
                finalPrediction = data.prediction;
            } else {
                throw new Error(data.error || 'Invalid response format');
            }
        } catch (err) {
            finalPrediction = (MODEL_COEF * numericInput) + MODEL_INTERCEPT;
        } finally {
            predictBtn.disabled = false;
            predictBtn.textContent = 'Predict Weight';
        }

        resultCard.style.display = 'block';
        animateCounter(predictedValueEl, 0, finalPrediction, 750);
    });
</script>

</body>
</html>
